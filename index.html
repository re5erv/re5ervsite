<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserv — Solo Indie Developer</title>
    <link rel="icon" type="image/png" href="faw.png">
    <style>
        @font-face {
            font-family: 'BustleFont';
            src: url('Bustlefont.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'BustleFont', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        .logo {
            max-width: 260px;
            width: 100%;
            margin-bottom: 25px;
            transition: transform 0.3s;
        }
        .logo:hover {
            transform: scale(1.05);
        }
        h1 {
            font-size: 3.2em;
            color: #FF6A00;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(255, 106, 0, 0.7);
        }
        .subtitle {
            color: #666;
            margin-bottom: 45px;
            font-size: 1em;
            line-height: 1.5;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        a {
            display: block;
            padding: 16px 22px;
            background: #1a1a1a;
            color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #333;
            transition: all 0.2s;
            font-size: 1.05em;
            text-align: left;
        }
        a:hover {
            background: #FF6A00;
            color: #000;
            border-color: #FF6A00;
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
        }
        a span {
            color: #666;
            font-size: 0.8em;
            float: right;
        }
        a:hover span {
            color: #000;
        }
        .footer {
            margin-top: 45px;
            color: #444;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Reserv" class="logo">
        <h1>RESERV</h1>
        <p class="subtitle">Solo indie developer. Creating Bustle — a 2D multiplayer war economy sim.</p>
        
        <div class="links">
            <a href="https://re5erv.itch.io" target="_blank">
                Itch.io <span>re5erv.itch.io</span>
            </a>
            <a href="https://github.com/re5erv" target="_blank">
                GitHub <span>github.com/re5erv</span>
            </a>
            <a href="https://t.me/reservdev" target="_blank">
                Telegram <span>t.me/reservdev</span>
            </a>
            <a href="https://tiktok.com/@re5erv" target="_blank">
                TikTok <span>@re5erv</span>
            </a>
            <a href="https://discord.com/invite/wAc6kWVpfy" target="_blank">
                Discord <span>wAc6kWVpfy</span>
            </a>
            <a href="https://vk.ru/re5erv" target="_blank">
                VK <span>vk.ru/re5erv</span>
            </a>
            <a href="https://reserv.fandom.com/ru/wiki/Reserv_Вики" target="_blank">
                Fandom <span>reserv.fandom.com</span>
            </a>
            <a href="https://www.youtube.com/@reservdev" target="_blank">
                YouTube <span>@reservdev</span>
            </a>
        </div>
        
        <p class="footer">© 2026 Reserv</p>
    </div>
</body>
</html>
