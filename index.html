    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;

        .container {

            color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #333;
            transition: all 0.2s;
            font-size: 1em;
            text-align: left;
        }
        a:hover {
            background: #ff8c00;
            color: #000;
            border-color: #ff8c00;
            transform: translateX(5px);
        }
        a span {
            color: #666;
            font-size: 0.8em;
            float: right;
        }
        a:hover span {
            color: #000;
        }
        .footer {
            margin-top: 40px;
